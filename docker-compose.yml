services:
  # ============================================================
  # Aplicação Next.js
  # ============================================================
  debitboard-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    container_name: debitboard-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.production.local
    environment:
      RUNNING_IN_CONTAINER: true
      MONGODB_URI: "mongodb://debitboard-mongo-db:27017/debit-board?replicaSet=rs0"
      KEYCLOAK_ISSUER: "http://debitboard-keycloak:8080/realms/debit-board"
      NEXTAUTH_URL: "http://localhost:3001"
      DB_DUMPS_DIR: "/var/lib/debit-board/dumps"
      OLLAMA_BASE_URL: "http://debitboard-ollama:11434"
      OLLAMA_CHAT_MODEL: "llama3.2"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
    volumes:
      - dumps_data:/var/lib/debit-board/dumps
    depends_on:
      debitboard-mongo-db:
        condition: service_healthy
      debitboard-keycloak:
        condition: service_started
      debitboard-ollama:
        condition: service_healthy
    networks:
      - debitboard-network

  # ============================================================
  # MongoDB — replica set (transações + change streams)
  # ============================================================
  debitboard-mongo-db:
    image: mongo:8.0
    container_name: debitboard-mongo-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: debit-board
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/27017' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 15s
    networks:
      - debitboard-network

  # ============================================================
  # Postgres para Keycloak
  # ============================================================
  debitboard-keycloak-db:
    image: postgres:16
    container_name: debitboard-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}",
        ]
      interval: 60s
      timeout: 3s
      retries: 3
    networks:
      - debitboard-network

  # ============================================================
  # Keycloak — import de realm + tema Keycloakify
  # ============================================================
  debitboard-keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: debitboard-keycloak
    restart: unless-stopped
    command:
      - "start-dev"
      - "--http-port=8080"
      - "--http-management-port=9000"
      - "--hostname=http://localhost:8080"
      - "--import-realm"
      - "--spi-theme-static-max-age=-1"
      - "--spi-theme-cache-themes=true"
      - "--spi-theme-cache-templates=true"
    ports:
      - "8080:8080"
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://debitboard-keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./.docker/keycloak:/opt/keycloak/data/import/realm.json:ro
      - ./.docker/keycloak/providers:/opt/keycloak/providers:ro
    depends_on:
      debitboard-keycloak-db:
        condition: service_healthy
    networks:
      - debitboard-network

  # ============================================================
  # Ollama — LLM e embeddings locais
  # ============================================================
  debitboard-ollama:
    image: ollama/ollama:latest
    container_name: debitboard-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2h"
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - debitboard-network

  # ============================================================
  # Init container — baixa os modelos necessários (executa uma vez)
  # ============================================================
  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: debitboard-ollama-pull
    restart: "no"
    depends_on:
      debitboard-ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen2.5:3b
        ollama pull nomic-embed-text
        echo "Modelos baixados com sucesso."
    environment:
      OLLAMA_HOST: "http://debitboard-ollama:11434"
      OLLAMA_CHAT_MODEL: "qwen2.5:3b"
    networks:
      - debitboard-network

  # ============================================================
  # Backup scheduler — chama /api/cron/backup a cada minuto
  # ============================================================
  backup-cron:
    image: alpine:3.20
    container_name: debitboard-backup-cron
    restart: unless-stopped
    environment:
      CRON_TOKEN: ${CRON_TOKEN}
      TZ: "UTC"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '*/1 * * * * wget -qO- --header="Authorization: Bearer ${CRON_TOKEN}" http://debitboard-app:3000/api/cron/backup > /dev/null 2>&1' > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      - debitboard-app
    networks:
      - debitboard-network

volumes:
  mongo_data:
  postgres_data:
  dumps_data:
  ollama_models:

networks:
  debitboard-network:
    driver: bridge
