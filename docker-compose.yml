services:
  # ============================================================
  # Aplicação Next.js
  # ============================================================
  debitboard-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    container_name: debitboard-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.production.local
    environment:
      RUNNING_IN_CONTAINER: true
      MONGODB_URI: "mongodb://debitboard-mongo-db:27017/debit-board?replicaSet=rs0"
      KEYCLOAK_ISSUER: "http://debitboard-keycloak:8080/realms/debit-board"
      NEXTAUTH_URL: "http://localhost:3001"
      DB_DUMPS_DIR: "/var/lib/debit-board/dumps"
      OLLAMA_BASE_URL: "http://debitboard-ollama:11434"
      OLLAMA_CHAT_MODEL: "qwen2.5:3b"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      OLLAMA_RERANK_MODEL: "qwen2.5:3b"
      # 🔥 Sidecar de export offline — o app NUNCA toca no docker.sock.
      EXPORTER_URL: "http://debitboard-realm-exporter:3099"
      EXPORTER_TOKEN: ${EXPORTER_TOKEN}
    volumes:
      - dumps_data:/var/lib/debit-board/dumps
    depends_on:
      debitboard-mongo-db:
        condition: service_healthy
      debitboard-keycloak:
        condition: service_started
      debitboard-ollama:
        condition: service_healthy
      debitboard-realm-exporter:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - debitboard-network

  # ============================================================
  # MongoDB — replica set (transações + change streams)
  # ============================================================
  debitboard-mongo-db:
    image: mongo:8.0
    container_name: debitboard-mongo-db
    restart: unless-stopped
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--quiet"
      # WiredTiger cache limitado a ~1.5GB; evita o motor engolir toda a RAM.
      - "--wiredTigerCacheSizeGB"
      - "1.5"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: debit-board
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/27017' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - debitboard-network

  # ============================================================
  # Postgres para Keycloak
  # ============================================================
  debitboard-keycloak-db:
    image: postgres:16
    container_name: debitboard-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}",
        ]
      interval: 60s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - debitboard-network

  # ============================================================
  # Keycloak — import de realm + tema Keycloakify
  # ============================================================
  debitboard-keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: debitboard-keycloak
    restart: unless-stopped
    command:
      - "start-dev"
      - "--http-port=8080"
      - "--http-management-port=9000"
      - "--hostname=http://localhost:8080"
      - "--import-realm"
      - "--spi-theme-static-max-age=-1"
      - "--spi-theme-cache-themes=false"
      - "--spi-theme-cache-templates=false"
    ports:
      - "8080:8080"
    env_file:
      - .env.production.local
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://debitboard-keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-debitboard}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Correção: monta apenas o realm.json, não a pasta inteira.
      # (Antes o Keycloak tentava ler `themes/` e `providers/` como se
      # fossem o realm.json — não quebrava por sorte, mas era frágil.)
      - ./.docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      # Tema FT puro — sem .jar, sem Keycloakify.
      - ./.docker/keycloak/themes:/opt/keycloak/themes:ro
      # 🗑️ Removido: `./.docker/keycloak/providers` — o `.jar` do
      #    Keycloakify não é mais montado. O arquivo pode ser movido
      #    para `providers.bak/` ou deletado quando confirmar que o
      #    tema FT funciona.
    depends_on:
      debitboard-keycloak-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - debitboard-network

  # ============================================================
  # Ollama — LLM e embeddings locais
  # ============================================================
  debitboard-ollama:
    image: ollama/ollama:latest
    container_name: debitboard-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      # Mantém 1 modelo carregado → evita reloads de ~2GB.
      # Bom o suficiente porque chat e rerank usam o MESMO modelo.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2h" # ← aspas fechadas (bug crítico #1)
    deploy:
      resources:
        limits:
          # Sem limite de CPU o Ollama monopoliza o host sob carga.
          # 4 vCPU é o sweet spot para qwen2.5:3b em 8-core.
          cpus: "4.0"
          # 3B Q4 (~2GB) + KV cache + overhead fica ~3GB; 6G dá folga.
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - debitboard-network

  # ============================================================
  # Init container — baixa os modelos necessários (executa uma vez)
  # ============================================================
  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: debitboard-ollama-pull
    restart: "no"
    depends_on:
      debitboard-ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[init] baixando qwen2.5:3b…"
        ollama pull qwen2.5:3b
        echo "[init] baixando nomic-embed-text…"
        ollama pull nomic-embed-text
        echo "[init] modelos prontos."
    environment:
      OLLAMA_HOST: "http://debitboard-ollama:11434"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - debitboard-network

  # ============================================================
  # Backup scheduler — chama /api/cron/backup a cada minuto
  # ============================================================
  backup-cron:
    image: alpine:3.20
    container_name: debitboard-backup-cron
    restart: unless-stopped
    environment:
      CRON_TOKEN: ${CRON_TOKEN}
      TZ: "UTC"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '*/1 * * * * wget -q -T 30 -O- --header="Authorization: Bearer ${CRON_TOKEN}" http://debitboard-app:3000/api/cron/backup > /dev/null 2>&1' > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      - debitboard-app
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - debitboard-network

    # ============================================================
  # Sidecar — export offline do realm Keycloak (com senhas)
  # ============================================================
  # Único container com acesso ao docker.sock. O app se comunica
  # com ele via HTTP autenticado. Ver `docker/realm-exporter/`.
  debitboard-realm-exporter:
    build:
      context: ./docker/realm-exporter
      dockerfile: Dockerfile
    container_name: debitboard-realm-exporter
    restart: unless-stopped
    environment:
      EXPORTER_TOKEN: ${EXPORTER_TOKEN}
      KEYCLOAK_CONTAINER: debitboard-keycloak
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.7.2
      KEYCLOAK_REALM: debit-board
      LOG_LEVEL: info
    user: root
    volumes:
      # ⚠️ ÚNICO ponto com acesso ao socket Docker. Sem cap_add,
      #    sem privileged — o CLI apenas fala com o socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # 🔥 Exposta ao host para permitir `npm run dev` fora do Docker.
      #    Em produção, mantenha comentada ou remova — o app fala com
      #    o sidecar pela rede interna (nome do serviço).
      - "3099:3099"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M
    networks:
      - debitboard-network
    # Sem `ports:` — acessível apenas pela rede interna.

volumes:
  mongo_data:
  postgres_data:
  dumps_data:
  ollama_models:

networks:
  debitboard-network:
    driver: bridge
