version: '3.8'

services:
  # Banco de dados da aplicação (MongoDB)
  mongo-db:
    image: mongo:8.0
    container_name: sast-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
      MONGO_INITDB_DATABASE: sast_platform
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - sast-network

  # Banco de dados do Keycloak (Postgres é mais robusto que H2)
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sast-network

  # Serviço de Identidade (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: sast-keycloak
    command: start-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    depends_on:
      - keycloak-db
    networks:
      - sast-network

volumes:
  mongo_data:
  postgres_data:

networks:
  sast-network:
    driver: bridge