name: Test and Coverage - Codecov

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define a pasta padrão para todos os comandos 'run', evitando múltiplos 'cd frontend'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # Ativa o cache automático para acelerar o 'npm ci'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Adicionado: Passo essencial para gerar o relatório que o Codecov precisa
      - name: Run tests with coverage
        run: npm run test -- --coverage 

      - name: Build project
        run: npm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }} # Prática recomendada na v5 da action do Codecov
          fail_ci_if_error: false
