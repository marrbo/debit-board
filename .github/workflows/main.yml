name: Test and Coverage

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm ci

    # - name: Run linter
    #   run: |
    #     npm run lint

    - name: Build
      run: |
        npm run build

    - name: Run tests with coverage and generate JUnit report
      run: |
        npx vitest run --coverage --reporter=junit --outputFile=test-report.junit.xml

    # Opcional: se preferir usar o script 'test:coverage' (caso exista no package.json)
    # em vez do comando direto, descomente a linha abaixo:
    # - name: Run tests with coverage
    #   run: |
    #     cd frontend
    #     npm run test:coverage

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./test-report.junit.xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: marrbo/debit-board
